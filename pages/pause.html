<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pause &amp; Think — Gates Of Heaven &amp; Hell</title>
<link rel="stylesheet" href="../styles/pause.css" />
</head>
<body>

  <div class="stage">

    <div class="gate">
      <div class="gate-arch"></div>
      <div class="gate-leaf left">
        <div class="gate-ring"></div>
        <div class="gate-grain"></div>
      </div>
      <div class="gate-leaf right">
        <div class="gate-ring"></div>
        <div class="gate-grain"></div>
      </div>
      <div class="gate-seam"></div>
    </div>

    <main class="content" aria-live="polite">
      <p class="eyebrow">Gates Of Heaven &amp; Hell</p>
      <h1 id="message" class="message">Are You Sure You Want To Continue?</h1>
      <p class="sub">Breathe. Reflect on your intention before passing through.</p>

      <form id="pauseForm" class="pause-form">
        <div id="inputWrapper" class="input-wrapper is-locked">
          <input
            type="text"
            id="confirmInput"
            class="confirm-input"
            placeholder="Reflecting…"
            disabled
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="actions">
          <button id="closeTabBtn" class="btn-walkaway" type="button">Close Tab</button>
          <button id="continueBtn" class="btn-continue" type="submit" disabled>Continue</button>
        </div>
      </form>
    </main>

  </div>

  <div id="toast" class="toast" role="status" aria-live="assertive"></div>

  <script src="../scripts/rules-engine.js"></script>
  <script src="../scripts/pause.js"></script>
</body>
</html>
