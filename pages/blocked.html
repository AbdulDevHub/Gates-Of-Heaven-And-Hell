<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Gate Is Sealed — Gates Of Heaven &amp; Hell</title>
<link rel="icon" href="../icons/icon32.png" />
<link rel="stylesheet" href="../styles/blocked.css" />
<link rel="stylesheet" href="../styles/heaven.css" />
</head>
<body>

  <canvas id="embers" aria-hidden="true"></canvas>
  <div class="fire-glow" aria-hidden="true"></div>

  <div class="stage" id="stage">
    <div class="portcullis" aria-hidden="true">
      <div class="bars"></div>
      <div class="spikes"></div>
    </div>

    <main class="content" aria-live="polite">
      <p class="eyebrow">Gates Of Heaven &amp; Hell</p>
      <p class="sealed">The Gate Is Sealed</p>
      <h1 id="message" class="message"></h1>
      <p class="sub">There is no way through &mdash; only away.</p>
      <p id="target" class="target"></p>
      <button id="closeTabBtn" class="btn-away" type="button">Turn Back</button>
      <p id="tally" class="tally"></p>
    </main>
  </div>

  <script src="../scripts/rules-engine.js"></script>
  <script src="../scripts/shared.js"></script>
  <script src="../scripts/reminders.js"></script>
  <script src="../scripts/heaven.js"></script>
  <script src="../scripts/blocked.js"></script>
</body>
</html>
